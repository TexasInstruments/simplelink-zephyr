tests:
  drivers.i2s:
    depends_on: i2s
    tags:
      - drivers
      - userspace
    filter: not CONFIG_I2S_TEST_USE_GPIO_LOOPBACK
    platform_exclude:
      - mimxrt595_evk/mimxrt595s/cm33
      - mimxrt685_evk/mimxrt685s/cm33
  drivers.i2s.gpio_loopback:
    depends_on:
      - i2s
      - gpio
    tags:
      - drivers
      - userspace
    filter: CONFIG_I2S_TEST_USE_GPIO_LOOPBACK
    harness: ztest
    platform_exclude:
      - mimxrt595_evk/mimxrt595s/cm33
      - mimxrt685_evk/mimxrt685s/cm33
    harness_config:
      fixture: gpio_loopback
  drivers.i2s.gpio_loopback.left_justified:
    depends_on:
      - i2s
      - gpio
    tags:
      - drivers
      - userspace
    filter: CONFIG_I2S_TEST_USE_GPIO_LOOPBACK
    harness: ztest
    platform_allow:
      - lp_em_cc35x1
    harness_config:
      fixture: gpio_loopback
    extra_configs:
      - CONFIG_I2S_TEST_DATA_FORMAT_LJF=y
  drivers.i2s.gpio_loopback.right_justified:
    depends_on:
      - i2s
      - gpio
    tags:
      - drivers
      - userspace
    filter: CONFIG_I2S_TEST_USE_GPIO_LOOPBACK
    harness: ztest
    platform_allow:
      - lp_em_cc35x1
    harness_config:
      fixture: gpio_loopback
    extra_configs:
      - CONFIG_I2S_TEST_DATA_FORMAT_RJF=y
