sample:
  name: TI CC140xP GenFSK RX Sample
  description: Sample application demonstrating TI CC140xP transceiver driver RX functionality using the generic 2-GFSK PHY
common:
  tags:
    - drivers
    - prop_rf
    - shield
  depends_on: spi gpio
tests:
  sample.shields.ti_bp_cc140xp.ti_cc140xp_genfsk_rx:
    harness: shield
    extra_args: SHIELD=ti_bp_cc140xp
    platform_allow:
      - lp_em_cc2745r10_q1/cc2745r10_q1
    integration_platforms:
      - lp_em_cc2745r10_q1/cc2745r10_q1
