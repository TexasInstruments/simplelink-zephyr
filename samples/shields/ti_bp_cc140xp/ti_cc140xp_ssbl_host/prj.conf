CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_CRC=y
CONFIG_MAIN_STACK_SIZE=4096

# By default a device's pinctrl_dev_config has internal (static) linkage,
# visible only inside the driver's own .c file. ssbl_host.c needs to reach
# spi0's pinctrl config directly (PINCTRL_DT_DEV_CONFIG_DECLARE/GET) to
# apply the custom "cs_sw_controlled" state (see the board overlay) and
# force DIO7 back to plain GPIO for the reset/trigger sequence. The symbol
# that actually controls this, PINCTRL_NON_STATIC, has no prompt and can't
# be set directly — PINCTRL_DYNAMIC is the user-facing option that selects
# it.
CONFIG_PINCTRL_DYNAMIC=y

# The board default (CONFIG_PM=y) lets the CPU enter low-power idle during
# any k_sleep(), which cycles every active device through PM_DEVICE_ACTION_
# SUSPEND/RESUME. The CC27xx SPI driver's RESUME handler re-applies its
# active pinctrl state on every one of those cycles — including DIO7, now
# that it's the driver's own hardware CS pin (see the board overlay) — which
# glitches CS repeatedly while main() busy-waits for the button press,
# unrelated to any real SPI transfer. Disabled here since this is a
# diagnostic-only sample with no power budget to protect.
CONFIG_PM=n

# With CONFIG_PM=n and CONFIG_PM_DEVICE unset, pinctrl.h unconditionally
# defines PINCTRL_SKIP_SLEEP (see drivers/pinctrl.h), dropping the "sleep"
# pinctrl state from every node at compile time. That leaves a dangling gap
# in spi0's now-3-state array (default/sleep/cs_sw_controlled), since the
# skipped state sits in the middle rather than at the end — breaking the
# generated C initializer with a bare comma. PM_DEVICE has no "depends on
# PM", so enabling just this (without re-enabling CONFIG_PM's automatic
# CPU-idle suspend/resume cycling) satisfies that #if and keeps "sleep"
# from being skipped, fixing the build without reintroducing the CS glitch
# CONFIG_PM=n was added to avoid.
CONFIG_PM_DEVICE=y
