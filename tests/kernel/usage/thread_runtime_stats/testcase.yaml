tests:
  kernel.usage:
    tags: kernel
    # The following architectures are excluded as they have boards that
    # exhibit precision timing anomalies related to emulation.
    #     posix, riscv32, sparc
    # The following architectures are exluded as the necessary
    # thread runtime statistic hooks do not yet exist.
    #     mips
    arch_exclude:
      - posix
      - sparc
      - mips
    # SMP is excluded as the test was only written for UP
    filter: not CONFIG_SMP
    integration_platforms:
      - qemu_x86
      - mps2/an385
    platform_exclude:
      - mr_canhubk3
      # Currently LPF3 devices are configured to tick rates higher than the
      # tests support
      - lp_em_cc2340r5
      - lp_em_cc2340r5moda
      - lp_em_cc2340r53
      - lp_em_cc2745r10_q1/cc2745r10_q1
      - lp_em_cc2745r10_q1/cc2755r10_q1
      - lp_em_cc2755p10
