## System and OS related flags
# Logging flag
CONFIG_LOG=y # disable logs to save RAM
# Console print flags
CONFIG_UART_CONSOLE=y # disable uart console to save RAM
CONFIG_PRINTK=y # disable printk to save RAM
CONFIG_CONSOLE=y # disable console to save RAM
# CLI shell support
CONFIG_SHELL=y # disable shell to save RAM

# Settings flag for storage of keys and DB related info
CONFIG_SETTINGS=y
# Heap pool size should e given for allocation of memory
CONFIG_HEAP_MEM_POOL_SIZE=3072

## BT flags
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
# Extended ADV flag
CONFIG_BT_EXT_ADV=y
# Encrypted ADV flag
CONFIG_BT_EAD=y
# Default device name
CONFIG_BT_DEVICE_NAME="esl_zephyr"
# Max connections
CONFIG_BT_MAX_CONN=1
# SMP flag
CONFIG_BT_SMP=y

## ESL TAG BT flags
CONFIG_BT_PERIPHERAL=y
# GATT DB dynamic flag
CONFIG_BT_GATT_DYNAMIC_DB=y
# Periodic ADV sync flag
CONFIG_BT_PER_ADV_SYNC=y
# Periodic ADV syn response flag
CONFIG_BT_PER_ADV_SYNC_RSP=y
# Periodic ADV response buffer size
CONFIG_BT_PER_ADV_SYNC_BUF_SIZE=247
# PAST reciever flag
CONFIG_BT_PER_ADV_SYNC_TRANSFER_RECEIVER=y
# PAST sender flag
CONFIG_BT_PER_ADV_SYNC_TRANSFER_SENDER=y
# Setting of dynamic device name flag
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# This sample needs more memory on BT_RX_THREAD
CONFIG_BT_RX_STACK_SIZE=1536

## ESL flags
CONFIG_BT_ESL_TAG=y
CONFIG_BT_ESL_MAX_SENSOR_SUPPORTED=2
CONFIG_BT_ESL_MAX_LED_SUPPORTED=2
CONFIG_BT_ESL_MAX_IMAGE_SUPPORTED=2
CONFIG_BT_ESL_MAX_DISPLAY_SUPPORTED=1
CONFIG_BT_ESL_OTS=y

### ESL OTS/L2CAP Related Configurations
# L2CAP MTU for ESL OTS protocol (4 hdr + 1 opcode + 64 pubkey = 69 bytes)
CONFIG_BT_L2CAP_TX_MTU=69

### ESL Debug Flags
CONFIG_ESL_PL_DEBUG_TO_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=1024
# Minimum 1536 to avoid stack overflow, 2048 leaves safety margin
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# prepare write count is required if ATT MTU is less than 64
CONFIG_BT_ATT_PREPARE_COUNT=4
