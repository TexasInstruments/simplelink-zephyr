# Wireless UART Bridge - Kconfig Configuration
# For CC2745 LaunchPad + CC140xP BoosterPack

# Core System
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y
CONFIG_SPI=y

# TI CC140xP Transceiver Driver
CONFIG_TI_CC140XP=y
# Silence the driver's per-SPI-transaction/per-request INF traces; keep warnings/errors.
CONFIG_TI_CC140XP_LOG_LEVEL_WRN=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=y

# Threading & Memory
CONFIG_NUM_COOP_PRIORITIES=16
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Timing
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Ring Buffer (for UART RX)
CONFIG_RING_BUFFER=y

# Disable unused features to save memory
CONFIG_NETWORKING=n
CONFIG_BT=n
CONFIG_WIFI=n
CONFIG_USB_DEVICE_STACK=n