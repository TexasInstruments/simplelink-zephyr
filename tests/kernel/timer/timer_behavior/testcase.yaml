tests:
  kernel.timer.timer:
    platform_exclude:
      # Currently LPF3 devices are configured to tick rates higher than the
      # tests support
      - lp_em_cc2340r5
      - lp_em_cc2340r53
      - lp_em_cc2745r10_q1/cc2745r10_q1
      - lp_em_cc2745r10_q1/cc2755r10_q1
    tags:
      - kernel
      - timer
    min_ram: 16
    platform_type:
      - mcu
    simulation_exclude:
      - renode
    harness_config:
      record:
        regex: "RECORD:(?P<metrics>.*)"
        as_json: ['metrics']
  kernel.timer.timer_behavior_external:
    filter: dt_compat_enabled("test-kernel-timer-behavior-external")
    harness: pytest
    harness_config:
      pytest_args: ['--tool', 'saleae_logic2', '--tool-options',
                    'address=127.0.0.1,port=10430,channel=1,sample-rate=6_250_000,threshold-volts=3.3']
      fixture: gpio_timerout
      record:
        regex: "RECORD:(?P<metrics>.*)"
        as_json: ['metrics']
    extra_configs:
      - CONFIG_TIMER_EXTERNAL_TEST=y
      - CONFIG_BOOT_DELAY=5000
