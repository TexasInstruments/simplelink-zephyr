CONFIG_BT_HCI_TI_CC3XXX=y

CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y

CONFIG_MBEDTLS=n

CONFIG_HEAP_MEM_POOL_SIZE=153600
CONFIG_MAIN_STACK_SIZE=61440

CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=4
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192

CONFIG_BT_DEVICE_NAME="TI Zephyr Mesh"
CONFIG_BT_MESH_ADV_BUF_COUNT=16
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_COUNT=12
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_AUTO_PHY_UPDATE=n

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_MESH_LOG_LEVEL_INF=y
