common:
  platform_exclude:
    # Currently LPF3 devices are configured to tick rates higher than the
    # tests support
    - lp_em_cc2340r5
    - lp_em_cc2340r5moda
    - lp_em_cc2340r53
    - lp_em_cc2745r10_q1/cc2745r10_q1
    - lp_em_cc2745r10_q1/cc2755r10_q1
    - lp_em_cc2755p10
tests:
  kernel.common.timing:
    tags:
      - kernel
      - sleep
  kernel.common.timing.minimallibc:
    tags:
      - kernel
      - sleep
      - libc
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
